<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telemetry Monitor</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("dashboard-theme");
            const theme = savedTheme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", theme);
        }());
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">TM</div>
                <div>
                    <h1>Telemetry Monitor</h1>
                    <p>Live UDP telemetry control room</p>
                </div>
            </div>
            <nav>
                <a class="{% if request.path == url_for('dashboard_home') %}active{% endif %}" href="{{ url_for('dashboard_home') }}">Dashboard</a>
                <a class="{% if request.path == url_for('devices_page') %}active{% endif %}" href="{{ url_for('devices_page') }}">Devices</a>
                <a class="{% if request.path == url_for('network_analysis_page') %}active{% endif %}" href="{{ url_for('network_analysis_page') }}">Network Analysis</a>
            </nav>
            <div class="sidebar-footer">
                <button type="button" class="button theme-toggle" id="theme-toggle">Dark Theme</button>
                <div class="status-chip">
                    <span class="status-dot-live"></span>
                    <span>Socket Link Active</span>
                </div>
                <p>Registration, ACKs, and metrics stream through the same UDP channel.</p>
            </div>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
